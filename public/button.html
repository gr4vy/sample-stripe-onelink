<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Onelink — button only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://js.stripe.com/v3/"></script>
    <style>
      body {
        font: 16px/1.5 system-ui, -apple-system, sans-serif;
        max-width: 480px;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #111;
        background: #fff;
      }
      h1 { font-size: 1.35rem; }
      .product {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1.5rem;
        background: #f7f7f7;
      }
      .price { font-size: 1.2rem; font-weight: 600; }
      #express-checkout-element { margin: 1rem 0; min-height: 50px; }
      #status {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 6px;
        background: #f3f3f3;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
      }
      .ok { background: #e6f4ea !important; color: #0b3d1f; }
      .err { background: #fde8e8 !important; color: #5a1414; }
      a.back { font-size: 0.9rem; color: #635bff; }
    </style>
  </head>
  <body>
    <a class="back" href="/">&larr; back</a>
    <h1>Onelink — button only</h1>
    <div class="product">
      <div>Sample item</div>
      <div class="price">$12.99 USD</div>
    </div>

    <!-- Stripe mounts ONLY the Onelink/Link express button here — no card form. -->
    <div id="express-checkout-element"></div>
    <div id="status" hidden></div>

    <script type="module">
      import { createOnelinkTransaction, initStripeElements } from "/onelink.js";

      const statusEl = document.getElementById("status");
      const set = (msg, kind) => {
        statusEl.hidden = false;
        statusEl.textContent = msg;
        statusEl.className = kind || "";
      };

      async function boot() {
        const params = new URLSearchParams(location.search);
        if (params.get("payment_intent_client_secret")) {
          set("Payment confirmed — returning to merchant.", "ok");
          return;
        }

        try {
          set("Creating Onelink session...");
          const { sessionData } = await createOnelinkTransaction({
            amount: 1299,
            currency: "USD",
            country: "US",
          });

          const { stripe, elements } = await initStripeElements(sessionData);

          // The Express Checkout Element renders just the express buttons.
          // Restricting paymentMethods to Link leaves only the Onelink/Link
          // button — the standalone button pattern.
          const expressCheckoutElement = elements.create("expressCheckout", {
            paymentMethods: {
              link: "auto",
              applePay: "never",
              googlePay: "never",
              paypal: "never",
              amazonPay: "never",
            },
          });
          expressCheckoutElement.mount("#express-checkout-element");
          statusEl.hidden = true;

          // Clicking the button opens Stripe's Onelink/Link sheet. On
          // confirm, finish the PaymentIntent client-side.
          expressCheckoutElement.on("confirm", async () => {
            set("Confirming payment...");
            const { error } = await stripe.confirmPayment({
              elements,
              confirmParams: {
                return_url: sessionData.returnUrl || `${location.origin}/button.html`,
              },
              redirect: "if_required",
            });
            if (error) set(`Payment failed: ${error.message}`, "err");
            else set("Payment confirmed ✓", "ok");
          });
        } catch (err) {
          set(`Error: ${err.message}`, "err");
        }
      }

      boot();
    </script>
  </body>
</html>
